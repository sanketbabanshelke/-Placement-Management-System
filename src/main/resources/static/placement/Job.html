
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5fa;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #243b64;
        }

        .form-box, .table-box {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        input, textarea, select {
            width: 100%;
            padding: 11px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        button {
            padding: 9px 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            margin: 3px;
        }

        .save-btn {
            background: #2563eb;
        }

        .view-btn {
            background: #16a34a;
        }

        .edit-btn {
            background: #e69b16;
        }

        .delete-btn {
            background: #dc2626;
        }

        .cancel-btn {
            background: #666;
        }

        .refresh-btn {
            background: #0891b2;
        }

        button:hover {
            opacity: 0.85;
        }

        .table-box {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #243b64;
            color: white;
        }

        .empty-message {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        /* View Details Popup */

        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            max-width: 500px;
            margin: 60px auto;
            padding: 25px;
            border-radius: 10px;
        }

        .modal-content h2 {
            color: #243b64;
            text-align: center;
        }

        .detail {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .close-btn {
            background: #dc2626;
            float: right;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Job Management System</h1>

    <!-- Job Registration Form -->

    <div class="form-box">

        <h2 id="formTitle">Add New Job</h2>

        <form id="jobForm">

            <label>Company Name</label>
            <input type="text" id="companyName"
                   placeholder="Enter Company Name" required>

            <label>Job Title</label>
            <input type="text" id="jobTitle"
                   placeholder="Enter Job Title" required>

            <label>Job Description</label>
            <textarea id="description"
                      placeholder="Enter Job Description"
                      required></textarea>

            <label>Location</label>
            <input type="text" id="location"
                   placeholder="Enter Location" required>

            <label>Salary</label>
            <input type="text" id="salary"
                   placeholder="Enter Salary" required>

            <label>Vacancies</label>
            <input type="number" id="vacancies"
                   placeholder="Enter Vacancies"
                   min="1" required>

            <label>Job Type</label>
            <select id="jobType" required>
                <option value="">Select Job Type</option>
                <option value="Full Time">Full Time</option>
                <option value="Part Time">Part Time</option>
                <option value="Internship">Internship</option>
            </select>

            <button type="submit" class="save-btn" id="submitBtn">
                Add Job
            </button>

            <button type="button" class="cancel-btn"
                    id="cancelBtn" onclick="resetForm()" hidden>
                Cancel Edit
            </button>

        </form>

    </div>

    <!-- Job List -->

    <div class="table-box">

        <h2>Job List</h2>

        <button class="refresh-btn" onclick="loadJobs()">
            Refresh List
        </button>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Company</th>
                    <th>Job Title</th>
                    <th>Location</th>
                    <th>Salary</th>
                    <th>Vacancies</th>
                    <th>Job Type</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="jobTable">
                <tr>
                    <td colspan="8" class="empty-message">
                        Loading Jobs...
                    </td>
                </tr>
            </tbody>

        </table>

    </div>

</div>


<!-- View Job Details Popup -->

<div id="viewModal" class="modal">

    <div class="modal-content">

        <button class="close-btn" onclick="closeView()">
            Close
        </button>

        <h2>Job Details</h2>

        <div id="jobDetails"></div>

    </div>

</div>


<script>

    // Backend API URL

    const API = "http://localhost:8080/api/jobs";

    let editingId = null;


    // ADD AND UPDATE JOB

    document.getElementById("jobForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const job = {

            companyName:
                document.getElementById("companyName").value.trim(),

            jobTitle:
                document.getElementById("jobTitle").value.trim(),

            description:
                document.getElementById("description").value.trim(),

            location:
                document.getElementById("location").value.trim(),

            salary:
                document.getElementById("salary").value.trim(),

            vacancies:
                Number(document.getElementById("vacancies").value),

            jobType:
                document.getElementById("jobType").value

        };

        try {

            let response;

            if (editingId === null) {

                response = await fetch(API, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(job)

                });

            } else {

                response = await fetch(API + "/" + editingId, {

                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(job)

                });

            }

            if (!response.ok) {
                throw new Error("Unable to save job");
            }

            alert(
                editingId === null
                ? "Job Added Successfully!"
                : "Job Updated Successfully!"
            );

            resetForm();

            loadJobs();

        } catch (error) {

            alert("Error: " + error.message);

        }

    });


    // LOAD ALL JOBS

    async function loadJobs() {

        const table = document.getElementById("jobTable");

        try {

            const response = await fetch(API);

            if (!response.ok) {
                throw new Error("Unable to load jobs");
            }

            const jobs = await response.json();

            table.innerHTML = "";

            if (jobs.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="8" class="empty-message">
                            No Jobs Available
                        </td>
                    </tr>
                `;

                return;
            }

            jobs.forEach(job => {

                const row = document.createElement("tr");

                const values = [
                    job.id,
                    job.companyName,
                    job.jobTitle,
                    job.location,
                    job.salary,
                    job.vacancies,
                    job.jobType
                ];

                values.forEach(value => {

                    const cell = document.createElement("td");

                    cell.textContent = value ?? "";

                    row.appendChild(cell);

                });


                // Action Buttons

                const actionCell = document.createElement("td");


                // View Button

                const viewButton = document.createElement("button");

                viewButton.textContent = "View";

                viewButton.className = "view-btn";

                viewButton.onclick = () => viewJob(job.id);


                // Edit Button

                const editButton = document.createElement("button");

                editButton.textContent = "Edit";

                editButton.className = "edit-btn";

                editButton.onclick = () => editJob(job.id);


                // Delete Button

                const deleteButton = document.createElement("button");

                deleteButton.textContent = "Delete";

                deleteButton.className = "delete-btn";

                deleteButton.onclick = () => deleteJob(job.id);


                actionCell.appendChild(viewButton);

                actionCell.appendChild(editButton);

                actionCell.appendChild(deleteButton);

                row.appendChild(actionCell);

                table.appendChild(row);

            });

        } catch (error) {

            table.innerHTML = `
                <tr>
                    <td colspan="8" class="empty-message">
                        Error Loading Jobs
                    </td>
                </tr>
            `;

            console.error(error);

            alert("Error: " + error.message);

        }

    }


    // VIEW JOB DETAILS

    async function viewJob(id) {

        try {

            const response = await fetch(API + "/" + id);

            if (!response.ok) {
                throw new Error("Job not found");
            }

            const job = await response.json();

            const details = document.getElementById("jobDetails");

            details.innerHTML = "";

            const values = [
                ["Job ID", job.id],
                ["Company Name", job.companyName],
                ["Job Title", job.jobTitle],
                ["Description", job.description],
                ["Location", job.location],
                ["Salary", job.salary],
                ["Vacancies", job.vacancies],
                ["Job Type", job.jobType]
            ];

            values.forEach(([label, value]) => {

                const div = document.createElement("div");

                div.className = "detail";

                const strong = document.createElement("strong");

                strong.textContent = label + ": ";

                const span = document.createElement("span");

                span.textContent = value ?? "";

                div.appendChild(strong);

                div.appendChild(span);

                details.appendChild(div);

            });

            document.getElementById("viewModal").style.display = "block";

        } catch (error) {

            alert(error.message);

        }

    }


    // CLOSE VIEW POPUP

    function closeView() {

        document.getElementById("viewModal").style.display = "none";

    }


    // EDIT JOB

    async function editJob(id) {

        try {

            const response = await fetch(API + "/" + id);

            if (!response.ok) {
                throw new Error("Job not found");
            }

            const job = await response.json();

            editingId = id;

            document.getElementById("companyName").value =
                job.companyName ?? "";

            document.getElementById("jobTitle").value =
                job.jobTitle ?? "";

            document.getElementById("description").value =
                job.description ?? "";

            document.getElementById("location").value =
                job.location ?? "";

            document.getElementById("salary").value =
                job.salary ?? "";

            document.getElementById("vacancies").value =
                job.vacancies ?? "";

            document.getElementById("jobType").value =
                job.jobType ?? "";

            document.getElementById("formTitle").textContent =
                "Update Job";

            document.getElementById("submitBtn").textContent =
                "Update Job";

            document.getElementById("cancelBtn").hidden = false;

            window.scrollTo(0, 0);

        } catch (error) {

            alert(error.message);

        }

    }


    // DELETE JOB

    async function deleteJob(id) {

        const confirmDelete = confirm(
            "Are you sure you want to delete this job?"
        );

        if (!confirmDelete) {
            return;
        }

        try {

            const response = await fetch(API + "/" + id, {

                method: "DELETE"

            });

            if (!response.ok) {
                throw new Error("Unable to delete job");
            }

            alert("Job Deleted Successfully!");

            if (editingId === id) {
                resetForm();
            }

            loadJobs();

        } catch (error) {

            alert(error.message);

        }

    }


    // RESET FORM

    function resetForm() {

        document.getElementById("jobForm").reset();

        editingId = null;

        document.getElementById("formTitle").textContent =
            "Add New Job";

        document.getElementById("submitBtn").textContent =
            "Add Job";

        document.getElementById("cancelBtn").hidden = true;

    }


    // CLOSE POPUP WHEN CLICKING OUTSIDE

    window.addEventListener("click", function(event) {

        const modal = document.getElementById("viewModal");

        if (event.target === modal) {
            closeView();
        }

    });


    // LOAD JOBS WHEN PAGE OPENS

    loadJobs();

</script>

</body>
</html>
