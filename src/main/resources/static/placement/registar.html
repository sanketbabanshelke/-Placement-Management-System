
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration | Placement Management System</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #e0e7ff);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 480px;
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
}

h2 {
    text-align: center;
    color: #1e3a8a;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 15px 0 7px;
    font-weight: bold;
    color: #334155;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    font-size: 15px;
}

input:focus, select:focus {
    outline: none;
    border-color: #2563eb;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 25px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.message {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}

.login-link {
    text-align: center;
    margin-top: 20px;
}

.login-link a {
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

    <h2>Create Account</h2>
    <p class="subtitle">Placement Management System</p>

    <form id="registerForm">

        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name" required>

        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="Create password" minlength="6" required>

        <label>Register As</label>
        <input type="text"id="text" disabled placeholder="Student">

        <button type="submit">Register Now</button>

        <p class="message" id="message"></p>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login Here</a>
    </div>

</div>

<script>
document.getElementById("registerForm").addEventListener("submit",
async function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const role = document.getElementById("role").value;
    const message = document.getElementById("message");

    message.style.color = "red";

    try {
        const response = await fetch("http://localhost:8080/api/auth/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                email: email,
                password: password,
                role: role
            })
        });

        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            message.textContent =
                errorData.message || "Registration Failed";
            return;
        }

        message.style.color = "green";
        message.textContent = "Registration Successful!";

        document.getElementById("registerForm").reset();

    } catch (error) {
        message.textContent = "Server connection failed";
        console.error(error);
    }
});
</script>

</body>
</html>
