
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Student Profile</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #eff6ff;
    padding: 30px 15px;
}

.container {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 18px #0002;
}

h2 {
    text-align: center;
    color: #1d4ed8;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 15px 0 7px;
    font-weight: bold;
    color: #334155;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 20px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.back {
    background: #64748b;
}

#message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h2>Edit Student Profile</h2>

<form id="editForm">

    <label>Full Name</label>
    <input type="text" id="fullName" required>

    <label>Email</label>
    <input type="email" id="email" required>

    <label>Mobile Number</label>
    <input type="tel" id="phone" required>

    <label>Department</label>
    <input type="text" id="department" required>

    <label>Graduation Year</label>
    <input type="number" id="graduationYear"
           min="2000" max="2100" required>

    <button type="submit">Update Profile</button>

    <button type="button" class="back"
            onclick="location.href='student-view-profile.html'">
        Back to Profile
    </button>

    <p id="message"></p>

</form>
</div>

<script>
const userId = localStorage.getItem("userId");
const userRole = localStorage.getItem("userRole");

let profileId = null;

if (!userId || userRole !== "STUDENT") {
    window.location.href = "login.html";
}

// Load Existing Profile
async function loadProfile() {

    try {
        const response = await fetch(
            "/api/stdinfo/student/" + encodeURIComponent(userId)
        );

        if (!response.ok) {
            document.getElementById("message").textContent =
                "Student Profile Not Found";
            return;
        }

        const data = await response.json();

        profileId = data.id;

        document.getElementById("fullName").value =
            data.fullName || "";

        document.getElementById("email").value =
            data.email || "";

        document.getElementById("phone").value =
            data.phone || "";

        document.getElementById("department").value =
            data.department || "";

        document.getElementById("graduationYear").value =
            data.graduationYear || "";

    } catch (error) {
        document.getElementById("message").textContent =
            "Server Connection Failed";
    }
}

// Update Profile
document.getElementById("editForm").addEventListener(
    "submit", async function(event) {

    event.preventDefault();

    if (profileId === null) {
        document.getElementById("message").textContent =
            "Profile is not loaded";
        return;
    }

    const profileData = {
        fullName: document.getElementById("fullName").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        department: document.getElementById("department").value,
        graduationYear: Number(
            document.getElementById("graduationYear").value
        )
    };

    try {
        const response = await fetch(
            "http://localhost:8080/api/stdinfo" + profileId,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(profileData)
            }
        );

        if (!response.ok) {
            throw new Error("Profile Update Failed");
        }

        document.getElementById("message").style.color = "green";
        document.getElementById("message").textContent =
            "Profile Updated Successfully!";

    } catch (error) {
        document.getElementById("message").style.color = "red";
        document.getElementById("message").textContent =
            error.message;
    }
});

loadProfile();
</script>

</body>
</html>
